name: Unit Tests
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - src/**
      - static/**
      - supabase/**
      - test/db/**
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  unit-tests:
    name: Unit and Database Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_OFFLINE: false
      PUBLIC_ANALYTICS_ENABLED: false
      PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      PUBLIC_SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      PUBLIC_USER_ASSETS_BASE_URL: http://127.0.0.1:9000/user-assets
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install
      - run: cp ./supabase/functions/.env.example ./supabase/functions/.env
      - run: pnpm services:start
      - name: Reset local Supabase database
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "Supabase reset attempt ${attempt}/3"
            if pnpm supabase db reset; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Supabase reset failed after 3 attempts."
              exit 1
            fi

            echo "Supabase reset failed; recycling the local Supabase stack before retrying..."
            pnpm supabase stop || true
            sleep 5
            pnpm supabase start
            sleep 5
          done
      - name: Unit Tests
        run: pnpm test:unit
      - name: Move Roller integrated browser test
        shell: bash
        run: |
          set -euo pipefail
          pnpm dev --host 127.0.0.1 --port 3000 > /tmp/poke5e-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              ready=true
              break
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Development server exited before becoming ready."
              cat /tmp/poke5e-dev.log
              exit 1
            fi

            sleep 1
          done

          if [ "$ready" != true ]; then
            echo "Development server did not become ready."
            cat /tmp/poke5e-dev.log
            exit 1
          fi

          BASE_URL=http://127.0.0.1:3000 pnpm exec playwright test test/smoke/move-roller.test.ts --project=smoke
      - name: Database Migration Tests
        run: pnpm test:db:quick
