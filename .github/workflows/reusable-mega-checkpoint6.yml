name: Reusable Mega Checkpoint 6

on:
  push:
    branches:
      - feature/reusable-mega-evolutions

jobs:
  validation:
    name: Frontend, Unit, Database, and Function Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUBLIC_OFFLINE: false
      PUBLIC_ANALYTICS_ENABLED: false
      PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      PUBLIC_SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYXNlLWRlbW8iLCJyb2xlIjoiYW5vbiIsImV4cCI6MTk4MzgxMjk5Nn0.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      PUBLIC_USER_ASSETS_BASE_URL: http://127.0.0.1:9000/user-assets
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: cp ./supabase/functions/.env.example ./supabase/functions/.env
      - name: Start local services
        run: pnpm services:start
      - name: Reset local database and apply migrations
        run: pnpm supabase db reset
      - name: Compile Paraglide translations
        run: pnpm exec paraglide-js compile --project ./project.inlang --outdir ./src/lib/site/i18n/paraglide --strategy url,baseLocale --emit-ts-declarations
      - name: Svelte and TypeScript checks
        run: pnpm check
      - name: Production build
        run: pnpm build
      - name: Unit tests
        id: unit-tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm test:unit 2>&1 | tee unit-test.log
      - name: Upload unit test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint6-unit-test-log
          path: unit-test.log
      - name: Fail on unit test failure
        if: steps.unit-tests.outcome == 'failure'
        run: exit 1
      - name: Database migration tests
        run: pnpm test:db:quick
      - name: Edge Function tests
        run: pnpm test:functions
