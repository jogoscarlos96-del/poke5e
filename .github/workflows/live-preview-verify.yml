name: Live Vercel Preview Verification

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  statuses: read

jobs:
  move-roller-live-preview:
    if: github.head_ref == 'feature/move-roller-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_URL: ${{ secrets.VERCEL_PREVIEW_URL }}
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium

      - name: Wait for current Vercel deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA/status" --jq '[.statuses[] | select(.context == "Vercel")][0].state // "missing"')"
            echo "Vercel status for $TARGET_SHA: $state"
            if [ "$state" = "success" ]; then
              sleep 5
              break
            fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              echo "Vercel deployment failed for $TARGET_SHA"
              exit 1
            fi
            if [ "$attempt" = "90" ]; then
              echo "Timed out waiting for Vercel deployment for $TARGET_SHA"
              exit 1
            fi
            sleep 5
          done

      - name: Wait for live Vercel preview
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PREVIEW_URL" || { echo "VERCEL_PREVIEW_URL is not configured"; exit 1; }
          for attempt in $(seq 1 30); do
            if curl -fsS "$PREVIEW_URL" >/dev/null; then
              echo "Preview is reachable"
              exit 0
            fi
            echo "Preview not ready yet (${attempt}/30); retrying in 5s..."
            sleep 5
          done
          echo "Preview did not become reachable"
          exit 1

      - name: Verify Move Roller on live Vercel preview
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${PREVIEW_URL%%\?*}" \
          VERCEL_SHARE_URL="$PREVIEW_URL" \
          pnpm exec playwright test test/smoke/move-roller.test.ts --project=smoke
