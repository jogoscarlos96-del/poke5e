name: Live Vercel Preview Verification

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  move-roller-live-preview:
    if: github.head_ref == 'feature/move-roller-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_URL: https://kornia-poke5e-git-feature-move-roller-f-cf5047-jcomplicado-6884.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium

      - name: Wait for live Vercel preview
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl -fsS "$PREVIEW_URL" >/dev/null; then
              echo "Preview is reachable: $PREVIEW_URL"
              exit 0
            fi
            echo "Preview not ready yet (${attempt}/90); retrying in 5s..."
            sleep 5
          done
          echo "Preview did not become reachable: $PREVIEW_URL"
          exit 1

      - name: Verify Move Roller on live Vercel preview
        run: BASE_URL="$PREVIEW_URL" pnpm exec playwright test test/smoke/move-roller.test.ts --project=smoke
