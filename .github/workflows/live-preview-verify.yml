name: Live Vercel Preview Verification

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  move-roller-live-preview:
    if: github.head_ref == 'feature/move-roller-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_URL: ${{ secrets.VERCEL_PREVIEW_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium

      - name: Wait for live Vercel preview
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PREVIEW_URL" || { echo "VERCEL_PREVIEW_URL is not configured"; exit 1; }
          for attempt in $(seq 1 90); do
            if curl -fsS "$PREVIEW_URL" >/dev/null; then
              echo "Preview is reachable"
              exit 0
            fi
            echo "Preview not ready yet (${attempt}/90); retrying in 5s..."
            sleep 5
          done
          echo "Preview did not become reachable"
          exit 1

      - name: Verify Move Roller on live Vercel preview
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${PREVIEW_URL%%\?*}" \
          VERCEL_SHARE_URL="$PREVIEW_URL" \
          pnpm exec playwright test test/smoke/move-roller.test.ts --project=smoke
