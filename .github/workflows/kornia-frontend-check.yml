name: Kornia Frontend Checks

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-and-build:
    name: Build and Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_OFFLINE: false
      PUBLIC_ANALYTICS_ENABLED: false
      PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      PUBLIC_SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      PUBLIC_USER_ASSETS_BASE_URL: http://127.0.0.1:9000/user-assets
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Paraglide output is generated by the Vite plugin during build and is
      # intentionally not committed. Build first so svelte-check can resolve
      # the generated i18n runtime/messages.
      - name: Production build
        run: pnpm build
      - name: Svelte and TypeScript check
        run: pnpm check
